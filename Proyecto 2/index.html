<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaBridge</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>JavaBridge - Traductor Java a Python</h1>
    </header>

    <div class="container">
        <!--CODIGO JAVA-->
        <div class="editor-section">
            <h2>Codigo Java</h2>
            <textarea id="codigoJava" placeholder="// Escribe tu codigo Java aqui"></textarea>
        </div>

        <!-- CONTROLES PRINCIPALES -->
        <div class="controls">
            <button id="traducirBtn">Traducir a Python</button>
        </div>

        <!--CODIGO PYTHON-->
        <div class="output-section">
            <h2>Codigo Python Traducido</h2>
            <textarea id="codigoPython" placeholder="El codigo Python aparecerá aqui..." readonly></textarea>
        </div>
    </div>

    <script src="js/lexer.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/traductor.js"></script>
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
