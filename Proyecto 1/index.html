<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourneyJS - Analizador de Torneos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>TourneyJS - Analizador de Torneos</h1>
    </header>

    <main>
        <section id="input-section">
            <h2>Cargar Archivo de Torneo</h2>
            <input type="file" id="fileInput" accept=".txt">
            <button onclick="cargarArchivo()">Cargar Archivo</button>
            <button onclick="limpiarTodo()" style="background-color: #dc3545; color: white;">Borrar Todo</button>
            <br>
            <textarea id="codeInput" placeholder="O pega el contenido del archivo aquí..." rows="10" cols="50"></textarea>
            <button onclick="analizarTexto()">Analizar Torneo</button>
        </section>
        
        <section id="results-section" style="display: none;">
            <h2>Resultados de Análisis</h2>

            <div id="action-buttons" style="margin-bottom: 20px;">
                <button id="btnGenerarReportes" onclick="generarReportes()" 
                    style="background-color: #28a745; color: white;">
                    Generar Reportes
                </button>
                <button id="btnMostrarBracket" onclick="mostrarBracket()" 
                    style="background-color: #17a2b8; color: white; display: none;">
                    Mostrar Bracket Graphviz
                </button>
            </div>

            <div id="tokens-container">
                <h3>Tokens Reconocidos</h3>
                <table id="tokens-table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Lexema</th>
                            <th>Tipo</th>
                            <th>Línea</th>
                            <th>Columna</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!--Tokens-->
                    </tbody>
                </table>
            </div>

            <div id="errors-container">
                <h3>Errores Léxicos</h3>
                <table id="errors-table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Lexema</th>
                            <th>Tipo de Error</th>
                            <th>Descripción</th>
                            <th>Línea</th>
                            <th>Columna</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!--Errores-->
                    </tbody>
                </table>
            </div>

            <div id="reportes-container">
                <!--Reportes principales-->
            </div>

            <div id="bracket-container" style="display: none;">
                <!--Bracket Graphviz-->
            </div>

        </section>
    </main>

    <footer>
        <p>Proyecto 1 | Lenguajes Formales y de Programación</p>
    </footer>

    <script src="modelo.js"></script>
    <script src="parser.js"></script>
    <script src="script.js"></script>
    <script src="reportes.js"></script>
</body>
</html>
